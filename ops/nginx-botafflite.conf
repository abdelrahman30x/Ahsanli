map $request_method $botafflite_login_key {
    default "";
    POST $binary_remote_addr;
}
limit_req_zone $botafflite_login_key zone=botafflite_login_post:10m rate=5r/m;
limit_req_status 429;
server {
    listen 80;
    server_name 134.122.89.95;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/botafflite-acme;
        try_files $uri =404;
    }
    location / { return 301 https://$host$request_uri; }
}
server {
    listen 443 ssl;
    server_name 134.122.89.95;
    ssl_certificate /etc/letsencrypt/live/134.122.89.95/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/134.122.89.95/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 2m;

    location /static/ {
        alias /var/www/botafflite-static/;
    }
    location = /login/ {
        limit_req zone=botafflite_login_post burst=5 nodelay;
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location = /otp/ {
        limit_req zone=botafflite_login_post burst=5 nodelay;
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location / {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 60s;
    }
}
