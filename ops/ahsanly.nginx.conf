# AHSANLY public site and Go API
# Serves apex, staff console, and country subdomains (EG, SA, AE, KW, QA, BH, OM, JO, IQ)
# Certificates from Let's Encrypt

map $request_method $ahsanly_login_key {
    default "";
    POST $binary_remote_addr;
}
limit_req_zone $ahsanly_login_key zone=ahsanly_login_post:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=ahsanly_catalog_api:10m rate=30r/m;
limit_req_status 429;

# HTTP: redirect all to HTTPS, except ACME challenges
server {
    listen 80;
    server_name ahsanli.com www.ahsanli.com eg.ahsanli.com sa.ahsanli.com ae.ahsanli.com kw.ahsanli.com qa.ahsanli.com bh.ahsanli.com om.ahsanli.com jo.ahsanli.com iq.ahsanli.com 134.122.89.95;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/ahsanly-acme;
        try_files $uri =404;
    }
    location / { return 301 https://$host$request_uri; }
}

# Apex domain: geo-redirect handled by Go API; everything else goes to Next.js
server {
    listen 443 ssl;
    server_name ahsanli.com www.ahsanli.com;

    ssl_certificate /etc/letsencrypt/live/ahsanli.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ahsanli.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 2m;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location = /api/v1/admin/session {
        limit_req zone=ahsanly_login_post burst=5 nodelay;
        proxy_pass http://127.0.0.1:8083;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 15s;
    }

    location ^~ /api/v1/ {
        limit_req zone=ahsanly_catalog_api burst=60 nodelay;
        proxy_pass http://127.0.0.1:8083;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 15s;
    }

    # Apex root: Go API decides geo-redirect or country selector.
    location = / {
        proxy_pass http://127.0.0.1:8083;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 10s;
    }

    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 20s;
    }
}

# Country subdomains: stable storefronts, no staff endpoints
server {
    listen 443 ssl;
    server_name eg.ahsanli.com sa.ahsanli.com ae.ahsanli.com kw.ahsanli.com qa.ahsanli.com bh.ahsanli.com om.ahsanli.com jo.ahsanli.com iq.ahsanli.com;

    ssl_certificate /etc/letsencrypt/live/ahsanli.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ahsanli.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 2m;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location ^~ /api/v1/ {
        limit_req zone=ahsanly_catalog_api burst=60 nodelay;
        proxy_pass http://127.0.0.1:8083;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 15s;
    }

    # Staff endpoints are not served on country subdomains
    location ^~ /console {
        return 404;
    }

    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 20s;
    }
}

# Old IP: permanent redirects to Egypt Arabic site or staff console
server {
    listen 443 ssl;
    server_name 134.122.89.95;

    ssl_certificate /etc/letsencrypt/live/134.122.89.95/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/134.122.89.95/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    location / {
        return 301 https://eg.ahsanli.com/ar$request_uri;
    }

    location ~ ^/(dashboard|admin|login|otp|logout|listing|candidate|evidence)/ {
        return 301 https://ahsanli.com/console;
    }
}
